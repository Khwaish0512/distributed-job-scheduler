spring.application.name=job-scheduler

# --- MySQL connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/job_scheduler
spring.datasource.username=scheduler_user
spring.datasource.password=scheduler_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Redis connection (we'll use this in a later phase) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379