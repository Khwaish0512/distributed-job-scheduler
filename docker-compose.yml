services:
  mysql:
    image: mysql:8.0
    container_name: job-scheduler-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: job_scheduler
      MYSQL_USER: scheduler_user
      MYSQL_PASSWORD: scheduler_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: job-scheduler-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  worker1:
    build: .
    container_name: job-scheduler-worker1
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_scheduler
      SPRING_DATASOURCE_USERNAME: scheduler_user
      SPRING_DATASOURCE_PASSWORD: scheduler_pass
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  worker2:
    build: .
    container_name: job-scheduler-worker2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_scheduler
      SPRING_DATASOURCE_USERNAME: scheduler_user
      SPRING_DATASOURCE_PASSWORD: scheduler_pass
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

volumes:
  mysql_data: